name: Smoke Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run smoke tests
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test-key' }}
      run: |
        pytest tests/smoke_test.py -v --tb=short
    
    - name: Test import health
      run: |
        python -c "from src.agent.core import Agent; print('✓ Agent imports OK')"
        python -c "from src.safety.content_filter import ContentFilter; print('✓ Safety imports OK')"
        python -c "from src.monitoring.responsible_ai_metrics import ResponsibleAIMetrics; print('✓ Monitoring imports OK')"
